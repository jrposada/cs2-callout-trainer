<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Callout Trainer</title>
  <meta name="description" content="Learn Counter-Strike 2 map callouts on clean radars: explore, then drill yourself by finding and naming spots.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/live.css">
  <link rel="stylesheet" href="css/smokes.css">
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand" href="./">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 1v6M12 17v6M1 12h6M17 12h6"/></svg>
        <span>Callout Trainer</span>
      </a>
      <div class="maps-wrap" id="mapsWrap">
        <nav class="maps" id="mapList" aria-label="Maps"></nav>
        <button type="button" class="maps-more prev" data-dir="-1" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M7.5 2 3.5 6l4 4"/></svg></button>
        <button type="button" class="maps-more next" data-dir="1" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M4.5 2l4 4-4 4"/></svg></button>
      </div>
    </header>

    <main class="main">
      <section class="stage" id="stage" aria-label="Map radar">
        <svg id="radar" class="radar" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radar">
          <image id="radarImg" x="0" y="0" width="1024" height="1024" preserveAspectRatio="none"/>
          <g id="layerZones"></g>
          <g id="layerFeedback"></g>
          <g id="layerMarkers"></g>
          <g id="layerEdit"></g>
        </svg>
        <div class="stage-tools">
          <div class="levels" id="levels" role="group" aria-label="Level"></div>
          <div class="zoom" role="group" aria-label="Zoom">
            <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
            <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
            <button type="button" id="zoomReset" aria-label="Fit map">Fit</button>
          </div>
        </div>
        <div class="stage-prompt" id="stagePrompt" aria-hidden="true"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </section>

      <aside class="panel">
        <div class="panel-nav">
          <div class="nav-top">
            <div class="seg content-seg" role="group" aria-label="Learn">
              <button type="button" data-content="callouts" aria-pressed="true">Callouts</button>
              <button type="button" data-content="smokes" aria-pressed="false" tabindex="-1">Smokes</button>
            </div>
            <span class="spacer"></span>
            <button type="button" class="nav-tool" data-tool="live" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Live</button>
          </div>
          <div class="modes" role="tablist" aria-label="Mode">
            <button type="button" role="tab" id="tab-explore" data-mode="explore" aria-selected="true" aria-controls="panelBody">Explore</button>
            <button type="button" role="tab" id="tab-name" data-mode="name" aria-selected="false" aria-controls="panelBody" tabindex="-1">Name it</button>
            <button type="button" role="tab" id="tab-find" data-mode="find" aria-selected="false" aria-controls="panelBody" tabindex="-1">Find it</button>
          </div>
          <div class="tool-head" hidden>
            <h2 class="tool-title"></h2>
            <button type="button" class="btn small" data-tool-done>Done</button>
          </div>
        </div>
        <div class="panel-body" id="panelBody" role="tabpanel" aria-labelledby="tab-explore"></div>
        <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
      </aside>
    </main>
  </div>

  <script src="data/maps.js"></script>
  <script src="data/routes.js"></script>
  <script src="data/smokes.js"></script>
  <script src="js/route-edit.js"></script>
  <script src="js/live.js"></script>
  <script src="js/smokes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
